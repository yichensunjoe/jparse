name: Windows executable

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[extract-diag]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-windows.txt
            scripts/requirements-windows-ocr.txt
            scripts/constraints-windows.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          java-package: jre
      - name: Build self-contained EXE
        run: python scripts/build_windows.py
      - name: Start the EXE and verify its PDF pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JPARSE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'JParse smoke data'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $env:no_proxy = '127.0.0.1,localhost'
          $exe = Join-Path $PWD 'dist/JParse-Windows-x64.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--server-only','18765' -PassThru
          if (!$proc.WaitForExit(600000)) { throw 'EXE extraction timed out' }
          if ($proc.ExitCode -ne 0) { throw "EXE launcher exited $($proc.ExitCode)" }
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try { $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18765/api/tasks -TimeoutSec 3; break }
            catch { Start-Sleep -Seconds 2 }
          } while ((Get-Date) -lt $deadline)
          if (!$health -or $health.StatusCode -ne 200) { throw 'EXE backend did not start' }
          $runtime = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'JParse/runtimes') -Directory | Where-Object { Test-Path (Join-Path $_.FullName '.complete') } | Select-Object -First 1
          if (!$runtime) { throw 'No extracted runtime found' }
          $python = Join-Path $runtime.FullName 'python/python.exe'
          $env:JAVA_HOME = Join-Path $runtime.FullName 'jre'
          $env:PATH = "$(Join-Path $env:JAVA_HOME 'bin');$env:PATH"
          $env:JPARSE_BUNDLED_PYTHON = $python
          $env:JPARSE_PADDLE_PYTHON = Join-Path $runtime.FullName 'ocr-python/python.exe'
          $env:PADDLE_PDX_CACHE_HOME = Join-Path $runtime.FullName 'ocr-models'
          $env:PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK = 'True'
          $env:JPARSE_LAYOUT_MODEL = Join-Path $runtime.FullName 'models/layout.onnx'
          $env:NOTO_FONT_PATH = Join-Path $runtime.FullName 'models/SourceHanSerifCN-Regular.ttf'
          $env:PYTHONUTF8 = '1'
          & $python scripts/run_windows_unit_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows unit tests failed' }
          & $python scripts/windows_exe_smoke.py --project (Join-Path $runtime.FullName 'project') --port 18765
          if ($LASTEXITCODE -ne 0) { throw 'Windows PDF smoke test failed' }
          # Exercise the actual no-argument, double-click launch path too.
          $portFile = Join-Path $env:JPARSE_DATA_DIR ('.port-' + $runtime.Name)
          $gui = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $guiHealthy = $false
          $browserStarted = $false
          do {
            $guiPort = Get-Content $portFile -ErrorAction SilentlyContinue
            try {
              $guiHealthy = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$guiPort/api/tasks" -TimeoutSec 2).StatusCode -eq 200
            } catch { }
            $browserStarted = [bool](Get-CimInstance Win32_Process -Filter "Name='msedge.exe' OR Name='chrome.exe'" |
              Where-Object { $_.CommandLine -like "*--app=http://127.0.0.1:$guiPort*" } | Select-Object -First 1)
            if ($guiHealthy -and $browserStarted) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if (!$guiHealthy -or !$browserStarted) { throw 'Double-click launch did not start both the backend and browser app window' }
          Write-Host 'Double-click launch started the backend and browser app window'
      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JParse-Windows-x64
          path: dist/JParse-Windows-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: ${{ runner.temp }}/JParse smoke data/logs/
          if-no-files-found: ignore
